# Qwen/Qwen3-1.7B (Apache 2.0) — KServe InferenceService(RawDeployment)
# 같은 모델을 ai/maas 의 LLMInferenceService(MaaS)로도 띄워 두 방식을 동시에 테스트한다
# - GPU 1장을 time-slicing 으로 2개로 나눠 쓴다 (openshift-cluster-gitops gpu-operator overlay 의 time-sliced-2)
# - kanana-1.5-2.1b 는 GA 런타임(vLLM 0.24, transformers 설정 검증)에서 hidden_size/heads 검증 오류로 기동하지 않아 교체했다
# AI팀이 관리한다. 허용되는 필드와 규칙은 ai/README.md
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-1-7b
  namespace: kbl-models
  annotations:
    openshift.io/display-name: Qwen3-1.7B
    # 모델 카탈로그(CATALOG.md)에 표시된다
    openshift.io/description: "소형 범용 모델 (text-to-text, 한국어 가능). MaaS/RawDeployment 동시 테스트용"
    serving.kserve.io/deploymentMode: Standard
    # 테스트 클러스터의 기존 프로파일. toleration/nodeSelector 를 webhook 이 넣어 준다
    opendatahub.io/hardware-profile-name: nvidia-gpu-serving
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    # 토큰 인증: kube-rbac-proxy 사이드카가 Bearer 토큰을 검증한다. 호출 권한은 Ops 가 관리
    # (ops/kbl-models/50-model-callers.yaml). 프록시가 API 서버를 호출하므로 아래 automountServiceAccountToken: true 가 필요
    security.opendatahub.io/enable-auth: "true"
  labels:
    kbl.io/runtime-tier: ga
    kbl.io/model-source: community
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  predictor:
    # 모델 파드 SA (ops/kbl-models/30-serviceaccount.yaml). 토큰 인증 프록시용으로 토큰을 마운트한다
    # (SA 권한은 system:auth-delegator 뿐). enable-auth 를 끄면 false 로 되돌린다
    serviceAccountName: model-serving
    automountServiceAccountToken: true
    # GPU 가 남지 않으면 RollingUpdate 의 새 파드가 Pending 으로 멈춘다. 기존 파드를 먼저 내린다 (짧은 중단 발생)
    deploymentStrategy:
      type: Recreate
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-ga-3-5-2
      storageUri: oci://quay.io/gunoh/modelcar-qwen3-1.7b@sha256:eb3010d967587f023944a55dacfa5b549d16fc66bda5c6ea195e7fad39d09dce
      args:
        # GPU time-slicing(2개)으로 MaaS 쪽 같은 모델과 GPU 1장(12GiB)을 나눠 쓴다. 두 파드 합이 0.9 를 넘지 않게 한다
        # 12GiB x 0.45 = 5.4GiB = 가중치 약 3.8GiB(BF16) + KV 캐시(토큰당 112KiB, 4096 토큰 0.44GiB) + 활성 메모리
        - --gpu-memory-utilization=0.45
        - --max-model-len=4096
        - --max-num-seqs=16
        # CUDA graph 메모리를 아낀다 (속도보다 두 개를 같이 띄우는 것이 목적)
        - --enforce-eager
        # Qwen3 는 thinking 모델이다. <think> 내용을 응답의 reasoning_content 로 분리한다
        # (생각 없이 답만 받으려면 요청에 chat_template_kwargs: {"enable_thinking": false})
        - --reasoning-parser=qwen3
      env:
        # 런타임/라이브러리의 외부 호출(모델 다운로드, 사용 통계)을 끈다
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: VLLM_NO_USAGE_STATS
          value: "1"
        - name: DO_NOT_TRACK
          value: "1"
      # hardware profile(nvidia-gpu-serving) 범위 안에서 지정한다 (model-hub 의 기존 배포와 같은 값)
      resources:
        limits:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
