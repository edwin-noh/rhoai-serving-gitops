# OGX(playground, OGXServer lsd-genai-playground) 메트릭 포트 9464 ← RHOAI 관측성 스택(redhat-ods-monitoring 의 OTel collector)
# - OGX operator 가 만드는 lsd-genai-playground-network-policy 는 9464 를 label network.openshift.io/policy-group=monitoring
#   네임스페이스(User Workload Monitoring)에만 연다. 그 NP 는 operator 소유라 고치지 않고, 허용을 더하는 NP 를 따로 둔다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ogx-metrics-rhoai-monitoring
  namespace: kbl-models
spec:
  podSelector:
    matchLabels:
      app: ogx
  policyTypes:
    - Ingress
  ingress:
    - from:
        # redhat-ods-monitoring 전체가 아니라 OTel collector 파드만 (토큰 없이 vLLM 을 부를 수 있는 범위를 줄인다)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
              app.kubernetes.io/instance: redhat-ods-monitoring.data-science-collector
      ports:
        - {protocol: TCP, port: 9464}
