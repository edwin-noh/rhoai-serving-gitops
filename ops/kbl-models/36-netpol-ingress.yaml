# 모델 파드로 들어올 수 있는 것
# - 8443(토큰 인증 프록시) ← 같은 네임스페이스(playground 등) + Ops 가 허용한 네임스페이스(라벨 kblife.co.kr/model-consumer=true)
#   토큰 검증·권한(Role model-caller)은 프록시가 한다 → 토큰 없이는 어디서도 호출 불가
# - 8080(vLLM 직결)·9464(OGX) 등 메트릭 포트 ← 모니터링 네임스페이스만 (아래 allow-monitoring-ingress).
#   같은 네임스페이스·에이전트 네임스페이스에는 열지 않는다 (토큰 우회 방지)
# - 호출자 등록(라벨 + SA + RoleBinding): ops/agent/<ns>.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-model-ingress
  namespace: kbl-models
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kblife.co.kr/model-consumer: "true"
      ports:
        - {protocol: TCP, port: 8443}
    # [대안: 포트·파드 단위] 모니터링 네임스페이스 전체(allow-monitoring-ingress) 대신 메트릭 수집기·포트만 열려면
    # allow-monitoring-ingress 를 지우고 아래 주석을 해제한다 (OGX 9464 는 파일 끝의 allow-ogx-metrics-rhoai-monitoring 도 해제)
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: openshift-user-workload-monitoring
    #     # redhat-ods-monitoring 전체가 아니라 OTel collector 파드만
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: redhat-ods-monitoring
    #       podSelector:
    #         matchLabels:
    #           app.kubernetes.io/component: opentelemetry-collector
    #           app.kubernetes.io/instance: redhat-ods-monitoring.data-science-collector
    #   ports:
    #     - {protocol: TCP, port: 8080}
---
# 모니터링 네임스페이스 → 이 네임스페이스의 모든 파드·포트 (vLLM 8080, OGX 9464 등 메트릭 수집)
# - User Workload Monitoring(콘솔 Observe), RHOAI 관측성 스택(redhat-ods-monitoring 의 OTel collector), 플랫폼 모니터링
# - 세 곳 모두 cluster-admin 이 관리하는 네임스페이스라 포트·파드 단위로 좁히지 않는다 (메트릭 포트가 늘어도 그대로 동작)
# - 감수하는 점: 이 네임스페이스들의 파드는 vLLM 8080 을 토큰 없이 부를 수 있다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-ingress
  namespace: kbl-models
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-monitoring
                  - openshift-user-workload-monitoring
                  - redhat-ods-monitoring
# [대안: 포트·파드 단위] OGX(playground) 메트릭 9464 를 RHOAI collector 파드에만 연다 (예전 37-netpol-ingress-ogx-metrics.yaml)
