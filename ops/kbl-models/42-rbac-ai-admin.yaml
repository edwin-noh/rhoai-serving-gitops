# AI admin(그룹 kbl-ai-admins): kbl-models 에서 Gen AI playground 를 쓴다
# - 권한 내용은 ClusterRole kbl-ai-playground (ops/platform/rbac-ai.yaml)
# - 조회(view)는 developers 와 같은 RoleBinding(40-rbac-ai.yaml)에 subject 로 함께 들어 있다
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kbl-ai-admins-playground
  namespace: kbl-models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kbl-ai-playground
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kbl-ai-admins
