# kbl-models(Raw ISVC) 의 MIG 조각 상한. 리소스 이름마다 둔다 (통 GPU 상한 requests.nvidia.com/gpu 는 ../kbl-models/10-resourcequota.yaml)
# - 값 = kbl-dgx-b300-v1 구성의 노드 전체 개수 (모델 서빙은 모두 kbl-models 에 둔다)
#     2g.67gb 14 = GPU0·1 각 1 + GPU2-5 각 3
#     1g.67gb  6 = GPU0·1 각 1 + GPU2-5 각 1
#     1g.34gb  8 = GPU0·1 각 4
# - OCR worker 등 다른 네임스페이스에서 MIG 를 쓰면 그 네임스페이스 몫만큼 여기서 줄이고 그쪽에 quota 를 둔다
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mig
  namespace: kbl-models
spec:
  hard:
    requests.nvidia.com/mig-2g.67gb: "14"
    requests.nvidia.com/mig-1g.67gb: "6"
    requests.nvidia.com/mig-1g.34gb: "8"
