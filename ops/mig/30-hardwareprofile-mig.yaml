    opendatahub.io/description: "1/7 SM · 67GB. RAG, OCR worker (메모리는 크고 연산은 작은 조각)"
    opendatahub.io/disabled: "false"
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
spec:
  identifiers:
    - identifier: cpu
      displayName: CPU
      resourceType: CPU
      minCount: 2
      defaultCount: 4
      maxCount: 8
    - identifier: memory
      displayName: Memory
      resourceType: Memory
      minCount: 16Gi
      defaultCount: 32Gi
      maxCount: 64Gi
    - identifier: nvidia.com/mig-1g.67gb
      displayName: MIG 1g.67gb
      resourceType: Accelerator
      minCount: 1
      defaultCount: 1
      maxCount: 1
---
