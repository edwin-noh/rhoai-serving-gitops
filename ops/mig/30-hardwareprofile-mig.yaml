# MIG 조각용 HardwareProfile. 모델(ISVC)이 고를 수 있는 크기를 Ops 가 정한다 (계획: DGX_B300_MIG_모델할당.md)
# - identifier 는 노드 allocatable 의 리소스 이름과 정확히 같아야 한다 (oc describe node 로 확인)
# - MIG 구성(10-mig-config.yaml)의 프로파일을 바꾸면 이 파일도 같이 바꾼다
# - 통 GPU(GPU 6·7)는 ops/platform/hardwareprofile-gpu*.yaml (nvidia.com/gpu)
# - 사용: ISVC annotation opendatahub.io/hardware-profile-name: <이름>, namespace redhat-ods-applications
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: mig-2g-67gb
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/display-name: NVIDIA B300 MIG 2g.67gb
    opendatahub.io/description: "2/7 SM · 67GB. AI Agent, OCR VLM1 (27B NVFP4)"
    opendatahub.io/disabled: "false"
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
spec:
  identifiers:
    - identifier: cpu
      displayName: CPU
      resourceType: CPU
      minCount: 2
      defaultCount: 8
      maxCount: 16
    - identifier: memory
      displayName: Memory
      resourceType: Memory
      minCount: 16Gi
      defaultCount: 48Gi
      maxCount: 96Gi
    - identifier: nvidia.com/mig-2g.67gb
      displayName: MIG 2g.67gb
      resourceType: Accelerator
      minCount: 1
      defaultCount: 1
      maxCount: 1
---
apiVersion: infrastructure.opendatahub.io/v1
