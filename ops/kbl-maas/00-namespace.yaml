# llm-d + MaaS 모델 네임스페이스 (Ops팀 관리)
# - maas.opendatahub.io/gateway-access: maas-default-gateway 가 이 라벨이 있는 네임스페이스의 HTTPRoute 만 받는다
# - 네임스페이스당 llm-d 스택 하나를 권장한다 (llm-d 문서)
apiVersion: v1
kind: Namespace
metadata:
  name: kbl-maas
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    opendatahub.io/dashboard: "true"
    maas.opendatahub.io/gateway-access: "true"
    argocd.argoproj.io/managed-by: openshift-gitops
    # CPU request = CPU limit x 10% (openshift-cluster-gitops cluster-resource-override). 모델 파드가 2 CPU 를
    # request 로 잡아 SNO 스케줄링이 막히는 것을 막는다. 라벨 이후 새로 생기는 파드부터 적용된다
    clusterresourceoverrides.admission.autoscaling.openshift.io/enabled: "true"
