# AI 개발자(kbl-ai-developers): kbl-maas 조회 = 기본 view 롤 (LLMInferenceService 변경은 Git → Argo CD)
# ai-ops 는 cluster-admin(ops/platform/rbac-ops.yaml), AI admin 은 클러스터 전체 view 라 여기서 따로 주지 않는다
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kbl-ai-developers-view
  namespace: kbl-maas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kbl-ai-developers
