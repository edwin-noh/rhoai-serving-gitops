# 성능 평가(EvalHub GuideLLM job)가 kbl-models 의 Raw 모델을 kube-rbac-proxy(8443) 경로로 호출한다.
# - 네임스페이스 kbl-eval 은 eval 리포(evaluation/evalhub/tenant/namespace.yaml)가 관리한다.
#   kblife.co.kr/model-consumer 라벨도 그쪽에 있다(네트워크). 여기서는 토큰 권한만 연다.
# - job pod 는 EvalHub operator 가 만든 SA 로 실행되고, sidecar 가 그 SA 토큰을 Bearer 로 넣는다
#   (RHOAI 3.5 Evaluating AI systems 2.16 "Authenticate models with a ServiceAccount token")
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caller-kbl-eval
  namespace: kbl-models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-caller
subjects:
  - kind: ServiceAccount
    name: evalhub-redhat-ods-applications-job
    namespace: kbl-eval
---
# RHOAI 프로젝트 조회: AI 개발자·AI admin 은 RHOAI 프로젝트(대시보드 라벨 네임스페이스)마다 view 를 받는다
# - RBAC 는 라벨로 네임스페이스를 고를 수 없어 프로젝트마다 RoleBinding 을 둔다 (kbl-models, kbl-maas, kai-agent, kbl-eval)
# - 쓰기 권한은 없다. 평가 실행 권한은 eval 리포의 kbl-evalhub-user 가 따로 준다
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kbl-ai-developers-view
  namespace: kbl-eval
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kbl-ai-developers
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kbl-ai-admins
