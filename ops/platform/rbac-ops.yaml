# ai-ops(kbl-ai-ops)는 클러스터 어드민 역할이다 → cluster-admin 하나로 준다 (네임스페이스별 RoleBinding 을 두지 않는다)
# - 그래도 변경은 Git(ops) → Argo CD 로 한다. Argo 가 관리하는 리소스를 직접 바꾸면 selfHeal 이 되돌린다
# - Argo CD 권한(AppProject roles)과 RHOAI 대시보드 adminGroups 는 Kubernetes RBAC 와 별개라 따로 둔다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kbl-ai-ops-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: kbl-ai-ops
