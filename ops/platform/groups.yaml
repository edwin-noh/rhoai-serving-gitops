# RHOAI 사용자 관리 = 이 파일의 Group 멤버십 (ai-ops 관리).
# 역할 3단 구분:
# - kbl-ai-developers: 에이전트 개발자. kbl-models/kbl-maas 조회, MaaS 구독, Argo CD kbl-ai 앱 조회/Sync,
#                      지정 프로젝트(ops/consumers/)에서 워크벤치. 프로젝트 생성 불가 (rbac-self-provisioner.yaml)
# - kbl-ai-admins:     AI admin. developers 권한 + 일부 RHOAI edit (Gen AI playground, ops/kbl-models/42-rbac-ai-admin.yaml)
#                      kbl-ai-developers 에도 함께 넣는다. 프로젝트 생성 가능
# - kbl-ai-ops:        클러스터 어드민 역할. ops/ 폴더와 Argo CD kbl-ops 앱 관리, 모델 네임스페이스 admin, 프로젝트 생성 가능
# - 대시보드 접근: RHOAI Auth CR(openshift-cluster-gitops 리포)의 adminGroups 에 kbl-ai-ops,
#   allowedGroups 에 kbl-ai-developers 가 들어 있다
# - 테스트 클러스터는 htpasswd 사용자(ops, ai-admin, ai)를 쓴다. AD 연동 환경이면 이 파일 대신 LDAP 그룹 동기화로 만든다
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-ai-ops
users:
  - ops
---
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-ai-developers
users:
  - ai
  - ai-admin
---
# AI admin: kbl-models 의 Gen AI playground 사용 (ops/kbl-models/42-rbac-ai-admin.yaml). kbl-ai-developers 에도 함께 넣는다
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-ai-admins
users:
  - ai-admin
