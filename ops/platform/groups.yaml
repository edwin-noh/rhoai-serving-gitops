# RHOAI 사용자 관리 = 이 파일의 Group 멤버십 (ai-ops 관리).
# 역할 3단 구분:
# - kbl-ai-developers: 에이전트 개발자. RHOAI 프로젝트(kbl-models, kbl-maas, kai-agent, kbl-eval) view,
#                      지정 프로젝트(ops/agent/, 예: kai-agent)에서 워크벤치, MaaS 구독(API 키), Argo CD kbl-ai 앱 조회.
#                      프로젝트 생성 불가 (rbac-self-provisioner.yaml)
# - kbl-ai-admins:     AI admin. developers 권한 전부(developers 를 주는 바인딩·MaaS 정책마다 subject 로 함께 넣는다)
#                      + Argo CD kbl-ai 앱 Sync + kbl-models 의 Gen AI playground (ops/kbl-models/42-rbac-ai-admin.yaml) + 프로젝트 생성(만든 프로젝트의 admin).
#                      클러스터 전체 view 는 없다
# - kbl-ai-ops:        클러스터 어드민. cluster-admin (rbac-ops.yaml), ops/ 폴더와 Argo CD kbl-ops 앱 관리
# - 대시보드 접근: RHOAI Auth CR(openshift-cluster-gitops 리포)의 adminGroups 에 kbl-ai-ops,
#   allowedGroups 에 kbl-ai-developers, kbl-ai-admins 를 둔다
#   (kbl-ai-admins 를 allowedGroups 에 넣기 전까지는 AI admin 사용자를 kbl-ai-developers 에도 넣어 둔다)
# - 테스트 클러스터는 htpasswd 사용자(ops, ai-admin, ai)를 쓴다. AD 연동 환경이면 이 파일 대신 LDAP 그룹 동기화로 만든다
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-ai-ops
users:
  - ops
---
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-ai-developers
users:
  - ai
  - ai-admin
---
# AI admin: developers 권한 + kbl-models 의 Gen AI playground (ops/kbl-models/42-rbac-ai-admin.yaml) + 프로젝트 생성
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-ai-admins
users:
  - ai-admin
---
# 성능(부하) 테스트 전용 MaaS 구독 그룹 (ops/maas-policy/subscription-kbl-perf.yaml).
# 이 그룹 사용자가 발급한 API key 로 EvalHub GuideLLM job 이 MaaS 모델에 부하를 준다.
# 일반 구독(kbl-ai-developers) 한도에 걸리지 않게 다른 구독 그룹과 겹치지 않는 사용자만 넣는다
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-perf-testers
users:
  - ops
