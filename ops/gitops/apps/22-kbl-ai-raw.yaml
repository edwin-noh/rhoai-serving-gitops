# AI팀 KServe InferenceService(RawDeployment) 앱 — ai/raw
# 21-kbl-ai-maas.yaml 과 함께 활성 (GPU time-slicing 2개로 같은 모델을 MaaS/Raw 동시 테스트). InferenceService 를 kbl-models 에 만들며 AppProject kbl-ai 로 범위가 제한된다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kbl-ai-raw
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: kbl-ai
  source:
    repoURL: https://github.com/edwin-noh/rhoai-serving-gitops.git
    targetRevision: main
    path: ai/raw
  destination:
    server: https://kubernetes.default.svc
    namespace: kbl-models
  syncPolicy:
    automated:
      selfHeal: true
      prune: true     # 파일을 지우면 모델도 내린다
